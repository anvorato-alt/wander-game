const hero=heroSrc.map(s=>{let i=new Image();i.src=s;return i}), dog=dogSrc.map(s=>{let i=new Image();i.src=s;return i});
let P={x:W*.36,y:0,vy:0,on:true,run:false,dir:1}, ground=()=>H*.73;
let pointer=null;
C.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};C.setPointerCapture(e.pointerId)});
C.addEventListener('pointermove',e=>{if(!pointer)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)>12){P.run=true;P.dir=dx>0?1:-1}});
C.addEventListener('pointerup',e=>{if(!pointer)return;let dy=e.clientY-pointer.y;if(dy<-35&&P.on){P.vy=-15;P.on=false} P.run=false;pointer=null});
function roundRect(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function drawBg(){
 if(bg.complete){let scale=Math.max(W/bg.width,H/bg.height);let bw=bg.width*scale,bh=bg.height*scale;let off=-(cam*.08)%(bw);for(let x=off-bw;x<W+bw;x+=bw)g.drawImage(bg,x,(H-bh)*.45,bw,bh)}
 let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'rgba(70,170,230,.12)');sky.addColorStop(1,'rgba(12,42,34,.22)');g.fillStyle=sky;g.fillRect(0,0,W,H);
}
function world(){
 let gy=ground();
 // stone cliff with mossy grass
 let rock=g.createLinearGradient(0,gy,0,H);
 rock.addColorStop(0,'#756a4d');rock.addColorStop(.18,'#5a5d43');rock.addColorStop(1,'#263d32');
 g.fillStyle=rock;g.fillRect(0,gy,W,H-gy);
 // irregular stone blocks
 g.strokeStyle='rgba(29,38,31,.38)';g.lineWidth=2;
 for(let yy=gy+28,row=0;yy<H;yy+=46,row++){
   let off=(row%2)*48;
   for(let xx=-off;xx<W;xx+=96){
     g.strokeRect(xx,yy,92,42);
   }
 }
 // mossy lip
 let moss=g.createLinearGradient(0,gy-14,0,gy+8);
 moss.addColorStop(0,'#b0cb68');moss.addColorStop(1,'#52733b');
 g.fillStyle=moss;g.fillRect(0,gy-13,W,16);
 // grass blades
 g.strokeStyle='#9dbb5b';g.lineWidth=2;
 for(let x=4;x<W;x+=13){
   let h=6+(x%11);g.beginPath();g.moveTo(x,gy-8);g.lineTo(x-3,gy-8-h);g.stroke();
 }
 // painterly floating platform
 let px=W*.67-(cam*.28%W);
 g.fillStyle='#5c5b43';g.beginPath();g.roundRect(px,gy-108,160,40,8);g.fill();
 g.fillStyle='#8eaa58';g.fillRect(px,gy-111,160,10);
 g.fillStyle='rgba(30,37,29,.28)';
 for(let k=0;k<3;k++)g.fillRect(px+14+k*47,gy-93,34,18);
 // coins
 for(let i=0;i<3;i++){
   let x=px+35+i*44,y=gy-145+Math.sin(t*3+i)*4;
   let rg=g.createRadialGradient(x,y,2,x,y,22);rg.addColorStop(0,'#fff9a8');rg.addColorStop(1,'rgba(255,190,0,0)');
   g.fillStyle=rg;g.beginPath();g.arc(x,y,22,0,7);g.fill();
   g.fillStyle='#ffd43d';g.beginPath();g.arc(x,y,10,0,7);g.fill();
   g.strokeStyle='#fff0a0';g.lineWidth=2;g.stroke();
 }
}
function update(){
 t+=1/60;
 if(P.run){cam+=P.dir*3.1;dist=Math.max(0,393-Math.floor(Math.max(0,cam)/38));}
 P.vy+=.78;P.y+=P.vy;
 if(P.y>=0){P.y=0;P.vy=0;P.on=true}
}
function drawSprite(img,x,feetY,h,flip=false){
 if(!img||!img.complete)return;let ratio=img.width/img.height,w=h*ratio;
 g.save();g.translate(x,feetY);if(flip)g.scale(-1,1);g.drawImage(img,-w/2,-h,w,h);g.restore();
}
function chars(){
 let gy=ground(), run=P.run&&P.on;
 let hf=run?1+(Math.floor(t*8)%2):0;
 let df=run?1+(Math.floor(t*9)%2):0;
 // shadows
 g.fillStyle='rgba(0,0,0,.23)';g.beginPath();g.ellipse(P.x,gy+2,25,6,0,0,7);g.fill();g.beginPath();g.ellipse(P.x-72,gy+2,28,6,0,0,7);g.fill();
 drawSprite(dog[df],P.x-82,gy+P.y+2,104,P.dir<0);
 drawSprite(hero[hf],P.x,gy+P.y+1,150,P.dir<0);
}
function hud(){
 let boxW=Math.min(W-28,430);
 g.fillStyle='rgba(6,18,18,.82)';g.beginPath();g.roundRect(14,16,boxW,68,16);g.fill();
 // hearts
 g.font='30px system-ui';g.fillStyle='#ff4d52';g.fillText('♥♥♥♥♥',28,59);
 // separator
 let sx=Math.min(205,boxW*.49);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(sx,27,1,44);
 // coin
 g.fillStyle='#ffd43d';g.beginPath();g.arc(sx+26,50,9,0,7);g.fill();
 g.font='700 20px system-ui';g.fillStyle='white';g.fillText(String(coins),sx+42,58);
